# oideachais/dlt_sources/official_media/fixtures/allowlist_parties.yaml
#
# All active political parties of the Republic of Ireland, Northern
# Ireland, and the United Kingdom. Verified via Wikipedia + the
# party's own home page.
#
# Source data:
#   - UK Electoral Commission Register of Political Parties
#   - Irish Electoral Commission Register (under Electoral Reform Act 2022)
#   - Wikipedia "List of political parties in the United Kingdom"
#   - Wikipedia "List of political parties in the Republic of Ireland"
#
# Selection: currently-registered parties with representation in a
# national legislature (UK HoC, Senedd, Holyrood, NI Assembly, Dáil
# Éireann / Seanad) or significant local council representation.

