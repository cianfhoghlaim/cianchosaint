  body: "GCHQ (Government Communications Headquarters)"
  jurisdiction: "uk"
  note: "Public-facing content only; classified material excluded by the OSINT ceiling"

- url: "https://www.gov.uk/government/organisations/defence-intelligence"
  category: intelligence_agency
  body: "Defence Intelligence (DI)"
  jurisdiction: "uk"
  note: "Public-facing content only; classified material excluded by the OSINT ceiling"

- url: "https://www.hmgcc.gov.uk/"
  category: intelligence_agency
  body: "HMGCC (His Majesty's Government Communications Centre)"
  jurisdiction: "uk"
  note: "Public-facing content only; classified material excluded by the OSINT ceiling"

