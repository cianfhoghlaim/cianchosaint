# cianchosaint — `dlt_sources/cianchosaint/common/osint_allowlist.yaml`
# Single coherent YAML document — restructured 2026-09-06 as part of
# openspec/changes/cianchosaint-politician-schema-v1. The pre-existing
# two-document stream was malformed (causing scripts/lint_license.py to
# fail with a YAMLParserError).
#
# The canonical OSINT allowlist for the cianchosaint repo. Every DLT
# source URL must appear here or scripts/lint_license.py exits 1.
# Every entry MUST reference a British Isles public-sector body per
# LICENSE.md. Licence: BUSL-1.1 (CIANCHOSAINT edition).
#
# Entry schemas:
#   - `source_url` + `category` + `body` + `jurisdiction` + `note`
#   - `source_url` + `ig_username` + `name` + `wikipedia_title` + `verified_at`
#     + `category` + `jurisdiction` + `body_class`
#

