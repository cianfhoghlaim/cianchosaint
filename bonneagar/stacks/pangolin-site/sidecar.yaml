# =============================================================================
# PANGOLIN SITE — Locket Sidecar Override
# =============================================================================
# Overrides the Pangolin Site container to source SITE_ID + SITE_SECRET
# from Locket-resolved Infisical secrets at runtime.
#
# Per the 2026-09-26-pangolin-newt-v1.23-upgrade-v1 openspec change (Stage 2a).
# =============================================================================

services:
  pangolin-site:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - pangolin-site-secrets:/run/secrets/locket:ro
