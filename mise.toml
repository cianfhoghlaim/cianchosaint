# mise.toml — Cianchosaint
# Post-v7 flattened repo, post-bootstrap-v2 wholesale-copy.
#
# SECTIONS:
#   1. core — dev env (sync + install + lint + test + format)
#   2. lint — openspec + licence + drift + skills
#   3. sync — knowledge sync loop (paths + ccc + cognee + skills + mcp + drift)
#   4. openspec — validate + archive + list + view
#   5. cianchosaint:provider — 4-tier provider chain health
#   6. cianchosaint:browser-tool — BrowserToolRouter health
#   7. cianchosaint:osint — OSINT allowlist audit
#   8. cianchosaint:bipp:v1 — British Isles Policing Pipeline milestones
#   9. cianchosaint:bidp:v1 — British Isles Defence Pipeline milestones
#  10. cianchosaint:biip:v1 — British Isles Intelligence Oversight Pipeline milestones
#  11. cianchosaint:ccc — CocoIndex Code indexing (init / index / search)
#  12. cianchosaint:web — per-persona web app health
#
# REMOVED (compared to Cianfhoghlaim's mise.toml):
#   - cic:* (author-archive DLT targets)
#   - biep:v3:* (BIEP milestones)
#   - subjects:* (NCCA subject specialists)
#   - notebooks:* (most marimo notebook tasks)
#   - meaisin:* (meaisinfhoghlaim v3 operator surface)
#   - oideachais:* (education-specific tasks)
#
# See openspec/changes/cianchosaint-repo-bootstrap-v2/specs/cianchosaint-bootstrap-v2/spec.md
# Requirement: Slimmed mise.toml (~25 tasks, REMOVE education tasks).

# mise.toml_format (set by mise at runtime)

_.python.compile = true


# ---------------------------------------------------------------------------
# 1. core — dev env (sync + install + lint + test + format)
# ---------------------------------------------------------------------------

[tasks.core]
description = "Core dev env: sync + install + lint + test + format"
run = "mise run sync:all && mise run lint:openspec && mise run test:smoke"


# ---------------------------------------------------------------------------
# 2. lint — openspec + licence + drift + skills
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Lint: openspec + licence + drift + skills"
run = [
  "mise run openspec:validate-all",
  "mise run lint:license",
]

[tasks."lint:license"]
description = "Audit OSINT allowlist + British Isles body check (uses cianchosaint OSINT allowlist at dlt_sources/cianchosaint/common/osint_allowlist.yaml)"
run = "python3 scripts/lint_license.py"

[tasks."lint:drift-docs"]
description = "Validate every AGENTS.md number claim against ground truth"
run = "python3 scripts/lint_drift_docs.py"

[tasks."lint:skills"]
description = "Validate .agents/skills/ metadata (YAML frontmatter)"
run = "python3 scripts/lint_skills.py"


# ---------------------------------------------------------------------------
# 3. sync — knowledge sync loop (paths + ccc + cognee + skills + mcp + drift)
# ---------------------------------------------------------------------------

[tasks."sync:all"]
description = "Run all 7 sync layers (paths + ccc + cognee + skills + mcp + dagster + drift)"
run = "python3 scripts/sync_all.py"

[tasks."sync:ccc"]
description = "Layer 2: CCC (CocoIndex Code) semantic code search index"
run = "bun run ccc:index"

[tasks."sync:paths"]
description = "Layer 1: pre-v7 path drift cleanup"
run = "python3 scripts/sync_paths.py"


# ---------------------------------------------------------------------------
# 4. openspec — validate + archive + list + view
# ---------------------------------------------------------------------------

[tasks."openspec:validate"]
description = "Validate one openspec change with --strict"
run = "openspec validate $argv --strict"
usage = '''
arg "<change-id>" help="The change ID to validate"
'''

[tasks."openspec:validate-all"]
description = "Validate ALL openspec changes + specs with --strict (CI gate)"
run = "openspec validate --all --strict"

[tasks."openspec:archive"]
description = "Archive a deployed openspec change"
run = "openspec archive $argv --yes"
usage = '''
arg "<change-id>" help="The change ID to archive"
'''

[tasks."openspec:list"]
description = "List pending openspec changes"
run = "openspec list"

[tasks."openspec:view"]
description = "Interactive dashboard of all specs + changes"
run = "openspec view"


# ---------------------------------------------------------------------------
# 5. cianchosaint:provider — 4-tier provider chain health
# ---------------------------------------------------------------------------

[tasks."cianchosaint:provider:health-check"]
description = "Ping the 4-tier provider chain (Unsloth Studio / LiteLLM / MiniMax / Gemini) + report health table"
run = "python3 -m baml_src._shared.provider_router.health_check"


# ---------------------------------------------------------------------------
# 6. cianchosaint:browser-tool — BrowserToolRouter health
# ---------------------------------------------------------------------------

[tasks."cianchosaint:browser-tool:health-check"]
description = "Ping BrowserToolRouter (Crawl4AI / Stagehand / Firecrawl / BrowserBase) + report health table"
run = "python3 -m baml_src._shared.browser_tool_router.health_check"

[tasks."cianchosaint:crawl4ai:smoke"]
description = "Crawl4AI smoke test (verifies the open-source browser tool is reachable)"
run = "python3 -m baml_src._shared.browser_tool_router.smoke_test crawl4ai"

[tasks."cianchosaint:stagehand:smoke"]
description = "Stagehand smoke test (verifies the browser automation tool is reachable)"
run = "python3 -m baml_src._shared.browser_tool_router.smoke_test stagehand"


# ---------------------------------------------------------------------------
# 7. cianchosaint:osint — OSINT allowlist audit
# ---------------------------------------------------------------------------

[tasks."cianchosaint:osint:health-check"]
description = "OSINT allowlist audit: verify every DLT source URL is in dlt_sources/cianchosaint/common/osint_allowlist.yaml"
run = "python3 -m dlt_sources.cianchosaint.common.osint_audit"


# ---------------------------------------------------------------------------
# 8. cianchosaint:bipp:v1 — British Isles Policing Pipeline milestones
# ---------------------------------------------------------------------------

[tasks."cianchosaint:bipp:v1:m1"]
description = "BIPP v1 milestone gate m1: An Garda Síochána (14 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.ireland.garda.pipeline",
]

[tasks."cianchosaint:bipp:v1:m2"]
description = "BIPP v1 milestone gate m2: UK-wide (data.police.uk + 43 forces)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.uk.policing.pipeline",
]

[tasks."cianchosaint:bipp:v1:m3"]
description = "BIPP v1 milestone gate m3: Crown Dependencies (3 forces)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.crown_dependencies.policing.pipeline",
]


# ---------------------------------------------------------------------------
# 9. cianchosaint:bidp:v1 — British Isles Defence Pipeline milestones
# ---------------------------------------------------------------------------

[tasks."cianchosaint:bidp:v1:m1"]
description = "BIDP v1 milestone gate m1: UK MoD + RAF + RN + Army (32 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.uk.defence.pipeline",
]

[tasks."cianchosaint:bidp:v1:m2"]
description = "BIDP v1 milestone gate m2: Irish Defence Forces (16 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.ireland.defence.pipeline",
]

[tasks."cianchosaint:bidp:v1:m3"]
description = "BIDP v1 milestone gate m3: JSP/JDP doctrine series (16 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.doctrine.pipeline",
]


# ---------------------------------------------------------------------------
# 10. cianchosaint:biip:v1 — British Isles Intelligence Oversight Pipeline milestones
# ---------------------------------------------------------------------------

[tasks."cianchosaint:biip:v1:m1"]
description = "BIIP v1 milestone gate m1: UK ISC + IPCO + IPT (24 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.uk.intel_oversight.pipeline",
]

[tasks."cianchosaint:biip:v1:m2"]
description = "BIIP v1 milestone gate m2: ROI oversight bodies (12 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.ireland.intel_oversight.pipeline",
]

[tasks."cianchosaint:biip:v1:m3"]
description = "BIIP v1 milestone gate m3: NI Policing Board + Garda Inspectorate (12 cohorts)"
run = [
  "mise run openspec:validate-all",
  "python3 -m dlt_sources.cianchosaint.ni.intel_oversight.pipeline",
]


# ---------------------------------------------------------------------------
# 11. cianchosaint:ccc — CocoIndex Code indexing
# ---------------------------------------------------------------------------

[tasks."cianchosaint:ccc:init"]
description = "First-time CCC setup: creates .cocoindex_code/settings.yml + .cocoindex_code/guides.yml"
run = "bash scripts/init_ccc.sh"

[tasks."cianchosaint:ccc:index"]
description = "Rebuild the CCC semantic code search index over the cianchosaint codebase"
run = "bun run ccc:index"

[tasks."cianchosaint:ccc:search"]
description = "Semantic search over the cianchosaint codebase (e.g. 'British Isles policing')"
run = "bun run ccc:search $argv"
usage = '''
arg "<query>" help="The semantic search query"
'''


# ---------------------------------------------------------------------------
# 12a. cianchosaint:cyberchef — GCHQ CyberChef (Apache 2.0) wholesale
# ---------------------------------------------------------------------------

[tasks."cianchosaint:cyberchef:smoke"]
description = "CyberChef smoke test (verifies the GCHQ CyberChef wholesale source is reachable + the operation catalog is intact)"
run = "python3 -m dlt_sources.cianchosaint.uk.cyberchef.recipe_extraction"

[tasks."cianchosaint:cyberchef:extract-recipe"]
description = "Extract a CyberChef recipe from a user's analysis request (delegates to the ExtractCyberChefRecipe BAML function)"
run = "python3 -c \"import asyncio; from agents.cianchosaint.tools.cyberchef_execute import cyberchef_execute; print(asyncio.run(cyberchef_execute(operations=['From_Base64','JSON_Beautify'], input_text='eyJoZWxsbyI6IndvcmxkIn0=', recipe_name='decode-base64+json-beautify', analyst_user_id='cianchosaint_analyst')))\""


# ---------------------------------------------------------------------------
# 12b. cianchosaint:stroom — GCHQ stroom (Apache 2.0) wholesale
# ---------------------------------------------------------------------------

[tasks."cianchosaint:stroom:health-check"]
description = "Stroom health check (verifies the GCHQ stroom wholesale source is reachable)"
run = "python3 -m dlt_sources.cianchosaint.uk.stroom.log_extraction"

[tasks."cianchosaint:stroom:route-logs"]
description = "Stroom route-logs: routes craw4ai browser logs + Langfuse observability traces to stroom for XSL transformation + enrichment"
run = "python3 -c \"import asyncio; from agents.cianchosaint.tools.stroom_query import stroom_query; print(asyncio.run(stroom_query(query='SELECT event_type, COUNT(*) FROM structured_events WHERE source_id IN (\\'craw4ai\\', \\'langfuse\\') GROUP BY event_type', analyst_user_id='cianchosaint_analyst')))\""


# ---------------------------------------------------------------------------
# 13. cianchosaint:web — per-persona web app health
# ---------------------------------------------------------------------------

[tasks."cianchosaint:web:list"]
description = "List all 8 per-persona web apps"
run = "ls web/apps/ | grep cianchosaint-"


# ---------------------------------------------------------------------------
# 13. cianchosaint:ncsc:device-security — NCSC device-security pre-flight
# ---------------------------------------------------------------------------

[tasks."cianchosaint:ncsc:device-security:check"]
description = "NCSC device-security pre-flight check: validates the citizen's host per the official UK government standards"
run = "bash web/apps/ciafagent-self-host/scripts/setup_ncsc_device_security.sh"

[tasks."cianchosaint:ncsc:device-security:setup"]
description = "NCSC device-security pre-flight + certificate issuance (BUSL-1.1 v2 signed cert at .state/ncsc-cert.pem)"
run = "bash web/apps/ciafagent-self-host/scripts/setup_ncsc_device_security.sh && cat web/apps/ciafagent-self-host/.state/ncsc-cert.pem"


# ---------------------------------------------------------------------------
# 14. cianchosaint:pdf-reference — PDF reference extraction + search
# ---------------------------------------------------------------------------

[tasks."cianchosaint:pdf-reference:extract"]
description = "Extract the HMGCC wargaming-audio PDF text via pdftotext + cache the BAML-extracted PDFReference record at dlt_sources/cianchosaint/uk/intelligence_agencies/hmgcc_pdf_reference.json"
run = "mkdir -p dlt_sources/cianchosaint/uk/intelligence_agencies/ && pdftotext hmgcc/a176bba9_de078709_1777299087.pdf /tmp/opencode/hmgcc_challenge.txt && python3 -m agents.cianchosaint.tools.pdf_reference_search"

[tasks."cianchosaint:pdf-reference:search"]
description = "Search the extracted HMGCC wargaming-audio PDF content (e.g. 'TRL requirements' or 'Bluetooth')"
run = "python3 -c 'import asyncio; from agents.cianchosaint.tools.pdf_reference_search import pdf_reference_search; import json; print(json.dumps(asyncio.run(pdf_reference_search($0, max_results=10)), indent=2))'"
usage = '''
arg "<query>" help="The search query (e.g. 'TRL requirements')"
'''


# ---------------------------------------------------------------------------
# 15. test — smoke tests
# ---------------------------------------------------------------------------

[tasks."test:smoke"]
description = "Smoke test: every openspec change validates + every spec parses"
run = [
  "mise run openspec:validate-all",
  "python3 -m pytest tests/smoke/ -v",
]


# ---------------------------------------------------------------------------
# 14. cianchosaint:bailo — Bailo (GCHQ ML model registry) stack
#     Per openspec/changes/cianchosaint-bailo-integration-v1/spec.md
# ---------------------------------------------------------------------------

[tasks."cianchosaint:bailo:health-check"]
description = "Ping the Bailo (GCHQ ML model registry) instance + report health"
run = "python3 -m baml_src._shared.bailo_integration"

[tasks."cianchosaint:bailo:register-models"]
description = "Register the 4 tier-chain models in Bailo (unsloth_studio/minimax-m3, litellm/minimax-m3, minimax_token_plan/minimax-m3, gemini_api/gemini-2.5-pro)"
run = "python3 -c 'from baml_src._shared.bailo_integration import BailoClient; from dlt_sources.cianchosaint.uk.bailo.model_registry import BAILO_TIER_CHAIN_MODELS; c = BailoClient(); [c.register_model(m[\"model_id\"], m[\"provider\"], m[\"model_name\"]) for m in BAILO_TIER_CHAIN_MODELS]; print(\"registered\", len(BAILO_TIER_CHAIN_MODELS), \"models\")'"


# ---------------------------------------------------------------------------
# 15. cianchosaint:gaffer — Gaffer (GCHQ graph database) stack
#     Per openspec/changes/cianchosaint-gaffer-integration-v1/spec.md
# ---------------------------------------------------------------------------

[tasks."cianchosaint:gaffer:health-check"]
description = "Ping the Gaffer (GCHQ graph database) instance + report health"
run = "python3 -m baml_src._shared.gaffer_integration"

[tasks."cianchosaint:gaffer:build-graph"]
description = "Build the cross-source relationship graph from the per-source policy aggregator + write to stedding/gaffer_graph.json"
run = "python3 scripts/build_gaffer_graph.py"


# ---------------------------------------------------------------------------
# 16. cianchosaint:ic-ui-kit — HMGCC IC Design System integration (Integration 1)
#     Per openspec/changes/2026-08-26-cianchosaint-ic-ui-kit-integration-v1/spec.md
# ---------------------------------------------------------------------------

[tasks."cianchosaint:ic-ui-kit:smoke"]
description = "Verify the ciafagent-ui-kit wholesale-copy is intact + every wholesale-copied .ts/.tsx file carries the licence attribution header (60+ ic-* dirs + 9 ciafagent integration wrappers)"
run = "bash web/packages/ciafagent-ui-kit/scripts/ic_ui_kit_smoke.sh"


# ---------------------------------------------------------------------------
# 17. cianchosaint:trl — TRL (UKRI/STFC Technology Readiness Level) assessment (Integration 7)
#     Per openspec/changes/2026-08-26-cianchosaint-ic-ui-kit-integration-v1/spec.md
# ---------------------------------------------------------------------------

[tasks."cianchosaint:trl:assess"]
description = "Assess every pending openspec change against the 9 UKRI/STFC TRL definitions (writes JSON to stedding/trl-assessments/<date>.json + prints a summary table)"
run = "python3 scripts/trl_assess.py"

[tasks."cianchosaint:trl:assess-json"]
description = "Same as cianchosaint:trl:assess but output JSON to stdout (for CI integration)"
run = "python3 scripts/trl_assess.py --json"

[tasks."cianchosaint:trl:assess-one"]
description = "Assess ONE specific openspec change by id"
run = "python3 scripts/trl_assess.py $argv"
usage = '''
arg "<change-id>" help="The openspec change id (e.g. cianchosaint-source-policy-v1)"
'''
