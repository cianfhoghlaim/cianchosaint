  domain: "00-browser-tool-router"

- title: "bipp-v1-policing"
  description: |
    BIPP v1 — British Isles Policing Pipeline. Ingest 53 forces × 7
    domains = ~371 cohorts. 43 UK territorial forces + PSNI +
    Metropolitan Police + Police Scotland + 4 Welsh forces + BTP +
    Crown Dependencies police forces (States of Jersey Police,
    Bailiwick of Guernsey Police, Isle of Man Constabulary). 7 domains
    are street-level crime, stop & search, outcomes, anti-social
    behaviour, police workforce, FOI responses, press releases. Per
    cianchosaint-pipeline spec § Requirement: BIPP v1 sub-pipeline.
  files:
    - openspec/specs/cianchosaint-pipeline/spec.md
    - dlt_sources/cianchosaint/ireland/law/courts_ie.py
    - dlt_sources/official_media_cianchosaint/__init__.py
    - dlt_sources/official_media_cianchosaint/ggy/sources.py
    - dlt_sources/official_media_cianchosaint/iom/sources.py
    - dlt_sources/official_media_cianchosaint/jsy/sources.py
    - dlt_sources/cianchosaint/common/osint_allowlist.yaml
  tags: [bipp, policing, bipp-v1, british-isles, psni, metpolice, police-scotland, btp, jersey, guernsey, isle-of-man]
  domain: "01-bipp-v1-policing"

- title: "bidp-v1-defence"
  description: |
    BIDP v1 — British Isles Defence Pipeline. Ingest 4 UK services +
    Irish DF + UK MoD + 2 doctrine series = 64 cohorts. The 4 UK
    services are RAF, Royal Navy, British Army, Royal Marines. The
    2 doctrine series are JSP (Joint Service Publications) + JDP
    (Joint Doctrine Publications). Irish DF is Óglaigh na hÉireann
    (Army + Air Corps + Naval Service). Per cianchosaint-pipeline
    spec § Requirement: BIDP v1 sub-pipeline.
  files:
    - openspec/specs/cianchosaint-pipeline/spec.md
    - dlt_sources/cianchosaint/ireland/law/__init__.py
    - dlt_sources/cianchosaint/ireland/law/doj.py
    - dlt_sources/cianchosaint/ireland/law/gov_ie_law.py
    - dlt_sources/official_media_cianchosaint/__init__.py
    - dlt_sources/cianchosaint/common/osint_allowlist.yaml
  tags: [bidp, defence, bidp-v1, british-army, raf, royal-navy, royal-marines, irish-df, mod, jsp, jdp]
  domain: "01-bidp-v1-defence"

- title: "biip-v1-intel-oversight"
  description: |
    BIIP v1 — British Isles Intelligence Oversight Pipeline. Ingest
    6 oversight bodies × 8 document kinds = 48 cohorts. The 6
    oversight bodies are UK ISC (Intelligence and Security Committee),
    UK IPCO (Investigatory Powers Commissioner's Office), UK IPT
    (Investigatory Powers Tribunal), NI Policing Board, ROI Policing
    Authority, Garda Inspectorate. Per cianchosaint-pipeline spec
    § Requirement: BIIP v1 sub-pipeline.
  files:
    - openspec/specs/cianchosaint-pipeline/spec.md
    - dlt_sources/cianchosaint/ireland/law/lawreform.py
    - dlt_sources/cianchosaint/ireland/law/doj.py
    - dlt_sources/official_media_cianchosaint/__init__.py
    - dlt_sources/official_media_cianchosaint/hmgcc/rolling_window.py
    - dlt_sources/cianchosaint/common/osint_allowlist.yaml
  tags: [biip, intel-oversight, biip-v1, isc, ipco, ipt, policing-board, policing-authority, garda-inspectorate]
  domain: "01-biip-v1-intel-oversight"

