# cianchosaint — `.cocoindex_code/guides.yml`
#
# Original (this file): new-build by Cian Mhac An Deisigh on 2026-08-23
# Licence: BUSL-1.1 (CIANCHOSAINT edition, per LICENSE.md)
#
# This file is part of cianchosaint (the British Isles defence / policing /
# intelligence-oversight open-source data platform). See LICENSE.md for
# the full Additional Use Grant + the 3-step foreign-use gate + the
# warrant-to-enforce clause.
#
# Loaded by ccc at search time. Each entry maps a high-level concept
# to the canonical files that best describe it. When a search query
# matches a guide's description, ccc returns a [guide] hit pointing
# the user at the canonical set, even if no individual file scored
# high on its own.
#
# Schema:
#   - title:        short label
#   - description:  what this guide is for (used for matching)
#   - files:        list of file paths (relative to project root) to surface
#   - tags:         optional list of keywords for matching
#   - domain:       optional human-readable category
#
# Post-2026-08-23: 12 initial guides (the cianchosaint-bootstrap-v2 cutover).
# The OSINT allowlist gates every guide on British-Isles-only sources per
# the cianchosaint-pipeline spec § Requirement: OSINT source URL allowlist.

- title: "openspec-change-search"
  description: |
    How to find any openspec change (pending or archived) by keyword,
    spec, or implementation status. Use when the user asks "what changes
    have we made for X", "is there a spec for Y", "where is the BIPP v1
    policing spec", "where is the BIIP v1 oversight spec", or "what is
    the umbrella cianchosaint-pipeline spec". 3 pending + 5 specs.
    Every change ships a proposal.md + tasks.md + cross-repo-sync.md +
    spec deltas (per the cianchosaint-pipeline spec § Requirement:
    Cross-repo openspec sync documentation).
  files:
    - openspec/AGENTS.md
    - openspec/specs/cianchosaint-pipeline/spec.md
    - openspec/specs/cianchosaint-per-constituency-agents/spec.md
    - openspec/specs/cianchosaint-agentic-interaction/spec.md
    - openspec/specs/cianchosaint-bootstrap-v2/spec.md
    - openspec/specs/cianchosaint-self-hosted-citizen/spec.md
    - openspec/changes/cianchosaint-repo-foundation-v1/proposal.md
    - openspec/changes/cianchosaint-repo-bootstrap-v2/proposal.md
    - openspec/changes/cianchosaint-agentic-interaction-v1/proposal.md
  tags: [openspec, changes, specs, archive, knowledge, cianchosaint]
  domain: "00-openspec"

- title: "dlt-source-search"
  description: |
    How to find any DLT data source by name, jurisdiction, or output
    destination. Use when the user asks 'is my DLT source up to date',
    'how many DLT sources do we have', 'does my DLT source use the
    canonical helpers', 'which DLT sources have drift', 'where is the
    HMGCC rolling-window source', 'where is the States of Jersey Police
    source'. All sources MUST be OSINT-allowlisted per
    dlt_sources/cianchosaint/common/osint_allowlist.yaml.
  files:
    - dlt_sources/cianchosaint/ireland/law/__init__.py
    - dlt_sources/cianchosaint/ireland/law/courts_ie.py
    - dlt_sources/cianchosaint/ireland/law/irish_statute_book.py
    - dlt_sources/cianchosaint/ireland/law/doj.py
    - dlt_sources/cianchosaint/ireland/law/lawreform.py
    - dlt_sources/cianchosaint/ireland/law/workplace_relations.py
    - dlt_sources/cianchosaint/ireland/law/citizensinformation.py
    - dlt_sources/cianchosaint/ireland/law/injuries_ie.py
    - dlt_sources/cianchosaint/ireland/law/gov_ie_law.py
    - dlt_sources/official_media_cianchosaint/__init__.py
    - dlt_sources/official_media_cianchosaint/ggy/sources.py
    - dlt_sources/official_media_cianchosaint/iom/sources.py
    - dlt_sources/official_media_cianchosaint/jsy/sources.py
    - dlt_sources/official_media_cianchosaint/hmgcc/rolling_window.py
    - dlt_sources/official_media_cianchosaint/allowlist.py
    - dlt_sources/cianchosaint/common/osint_allowlist.yaml
  tags: [dlt, sources, jurisdictions, dlt_sources, cianchosaint, osint]
  domain: "08-dlt"

- title: "baml-function-search"
  description: |
    How to find any BAML extraction function by name, output type, or
    client model. Use when the user asks 'what BAML functions extract
    Irish court judgments', 'which function uses the unsloth_studio
    client', 'how do I call the ExtractCourtJudgment function', 'where
    is the Irish law BAML family'. The 4-tier provider chain (Unsloth
    Studio → LiteLLM → MiniMax → Gemini) is wired in baml_src/clients.baml
    + baml_src/_shared/provider_router.py per the cianchosaint-pipeline
    spec § Requirement: 4-tier model provider chain.
  files:
    - baml_src/clients.baml
    - baml_src/_shared/provider_router.py
    - baml_src/cianchosaint/__init__.py
    - baml_src/cianchosaint/ireland/law/__init__.py
    - baml_src/cianchosaint/ireland/law/court_rules.baml
    - baml_src/cianchosaint/ireland/law/courts.baml
    - baml_src/cianchosaint/ireland/law/judgements.baml
    - baml_src/cianchosaint/ireland/law/legal_aid.baml
    - baml_src/cianchosaint/ireland/law/piab.baml
    - baml_src/cianchosaint/ireland/law/shared_legal_enums.baml
    - baml_src/cianchosaint/processing/official_media.baml
  tags: [baml, extraction, functions, clients, schema, cianchosaint, unsloth]
  domain: "08-baml"

- title: "cocoindex-flow-search"
  description: |
