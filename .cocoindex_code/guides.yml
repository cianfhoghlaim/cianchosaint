  description: |
    The FirecrawlMCPClient wrapper + the polyglot memory router
    (Graphiti for temporal + LanceDB for vector + Cognee for
    cross-doc). Use when the user asks 'how do I scrape gov.uk press
    releases', 'how do I respect the Firecrawl budget', 'how do I
    integrate a new Firecrawl tool', 'where is the FirecrawlMCPClient
    wrapper'. Every Firecrawl call MUST be OSINT-allowlisted per the
    cianchosaint-pipeline spec § Requirement: OSINT source URL allowlist.
