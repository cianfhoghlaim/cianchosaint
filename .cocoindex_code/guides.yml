    - cocoindex_flows/cianchosaint/ireland/legal_aid.py
    - cocoindex_flows/cianchosaint/ireland/legal_embedding.py
  tags: [cocoindex, v1-app, embedding, lance, bge-m3, cianchosaint]
  domain: "08-cocoindex"

- title: "browser-tool-router-search"
  description: |
    The browser-tool router (Crawl4AI + Stagehand + Firecrawl + Playwright)
    in cianchosaint. Use when the user asks 'which browser tool fits
    task X', 'how do I add a new browser backend', 'where is the
    authentication-aware browser flow', 'how do I scrape a gov.uk
    press-release', 'how do I respect robots.txt + the OSINT allowlist'.
    All scrapes MUST pass the OSINT allowlist check before the browser
