# kcg_subapp_manifest.yaml — the 3-tier subapp declaration.
# Read by kings_college_galway/scripts/kcg/sync-subapps.py.
# See openspec/specs/web-frontend-3-tier/spec.md for the full spec.

api_version: kcg/v1
kind: subapp

metadata:
  name: cianchosaint
  display_name: OSINT defence / policing / intel oversight
  upstream_repo: github.com/cianmacandeisigh/cianchosaint
  upstream_branch: main
  parent: kings_college_galway

spec:
  # TIER 3 is the only valid value for subapps.
  tier: 3

  # The 5 valid pace layers: daily | weekly | monthly | quarterly | per_openspec_change
  pace_layer: monthly

  # The 4 valid deployment targets: gcp_cloud_run | bare_metal | private_cloud | parent
  deployment_target: private_cloud

  # The 5 valid licences: MIT | BUSL-1.1 | BUSL-1.1-v2-cianchosaint | BUSL-1.1-v2-ciandlithe | pending
  licence: BUSL-1.1-v2-cianchosaint

  # The TIER 1 packages this subapp uses.
  # Valid values: model-registry | fleet | theming | agui-bridge | baml-helpers |
  #               observability | db | auth | ui-kit | dlt-common
  depends_on_tier_1:
    - model-registry
    - fleet
    - theming
    - agui-bridge
    - observability
    - dlt-common
    - auth
    - baml-helpers
    - ui-kit
    - db

  # The BAML extract surfaces (in the subapp).
  baml_surfaces:
    - cianchosaint

  # The openspec change IDs to mirror.
  openspec_changes:
    - 2026-08-24-cianchosaint-pipeline-architecture-v1
    - 2026-08-24-cianchosaint-bipp-v1-m1
    - 2026-08-24-cianchosaint-bipp-v1-m2
    - 2026-08-24-cianchosaint-bipp-v1-m3
    - 2026-08-24-cianchosaint-bidp-v1-m1
    - 2026-08-24-cianchosaint-bidp-v1-m2
    - 2026-08-24-cianchosaint-bidp-v1-m3
    - 2026-08-24-cianchosaint-biip-v1-m1
    - 2026-08-24-cianchosaint-biip-v1-m2
    - 2026-08-24-cianchosaint-biip-v1-m3
