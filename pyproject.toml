[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cianchosaint"
version = "0.1.0"
description = "British Isles defence / policing / intelligence-oversight open-source data platform"
readme = "README.md"
license = { text = "BUSL-1.1 (per LICENSE.md)" }
requires-python = ">=3.12"
authors = [
    { name = "Cian Pierce Lyons", email = "cianfhoghlaim@users.noreply.github.com" },
]
keywords = [
    "british-isles",
    "defence",
    "policing",
    "intelligence-oversight",
    "osint",
    "dlt",
    "baml",
    "dagster",
    "cocoindex",
    "motherduck",
    "ducklake",
    "lancedb",
    "tanstack-start",
    "convex",
    "ag-ui",
    "copilotkit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Government",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology :: Law Enforcement",
]

dependencies = [
    "dlt[duckdb]>=1.4.0",
    "dagster>=1.13.0",
    "baml-py>=0.223.0",
    "cocoindex>=1.0.14",
    "lancedb>=0.20.0",
    "duckdb>=1.4.0",
    "motherduck>=0.10.0",
    "pydantic>=2.10.0",
    "structlog>=25.0.0",
    "pyyaml>=6.0.0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.0",
    "mypy>=1.13.0",
    "openspec>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "RET", "SIM", "PTH", "ERA"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["cianchosaint"]
