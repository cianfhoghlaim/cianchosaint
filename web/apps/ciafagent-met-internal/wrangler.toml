name = "ciafagent-met-internal"
compatibility_date = "2026-08-23"
pages_build_output_dir = "dist"
main = "apps/web/app.config.ts"
[env.production]
  routes = [{ pattern = "met-internal.cianchosaint.ie/*", zone_name = "cianchosaint.ie" }]
  vars = { CONVEX_DEPLOYMENT = "prod:conic-met-internal", COPILOTKIT_RUNTIME_URL = "/api/copilotkit", ROOT_AGENT = "met_root_agent", JURISDICTION = "met", AUDIENCE = "internal" }
[env.staging]
  routes = [{ pattern = "staging-met-internal.cianchosaint.ie/*", zone_name = "cianchosaint.ie" }]
  vars = { CONVEX_DEPLOYMENT = "staging:conic-met-internal", COPILOTKIT_RUNTIME_URL = "/api/copilotkit", ROOT_AGENT = "met_root_agent", JURISDICTION = "met", AUDIENCE = "internal" }
