name = "ciafagent-psni-public"
compatibility_date = "2026-08-23"
pages_build_output_dir = "dist"
main = "apps/web/app.config.ts"
[env.production]
  routes = [{ pattern = "psni-public.cianchosaint.ie/*", zone_name = "cianchosaint.ie" }]
  vars = { CONVEX_DEPLOYMENT = "prod:conic-psni-public", COPILOTKIT_RUNTIME_URL = "/api/copilotkit", ROOT_AGENT = "psni_root_agent", JURISDICTION = "psni", AUDIENCE = "public" }
[env.staging]
  routes = [{ pattern = "staging-psni-public.cianchosaint.ie/*", zone_name = "cianchosaint.ie" }]
  vars = { CONVEX_DEPLOYMENT = "staging:conic-psni-public", COPILOTKIT_RUNTIME_URL = "/api/copilotkit", ROOT_AGENT = "psni_root_agent", JURISDICTION = "psni", AUDIENCE = "public" }
